resume: null
# Adapted fold-0 checkpoint (scripts/adapt_checkpoint.py, zero-init new columns). Use with a run config that has num_folds: 1.
init_weights: ./weights/adapted/CoPRA_fold0_adapted_zero.ckpt
model:
  model_type: copra
  esm_type: 650M
  pooling: token
  output_dim: 1
  fix_lms: true
  lora_tune: false
  lora_rank: 16
  lora_alpha: 32
  pair_dim: 40
  energy_embed_dim: 40
  representation_layer: 33
  coformer:
    embed_dim: 320
    pair_dim: 40
    num_blocks: 6
    num_heads: 20
    use_rot_emb: true
    attn_qkv_bias: false
    attention_dropout: 0.1
    transition_dropout: 0.0
    residual_dropout: 0.1
    transition_factor: 4
    use_flash_attn: false

train:
  max_iters: 30_000
  val_freq: 1000
  seed: 2024
  max_grad_norm: 100.0
  optimizer:
    type: adam
    lr: 1.e-5      # everything except the energy tensors; sweep {1e-5, 3e-5}
    lr_new: 3.e-4  # energy_embeder.{freq,phase} + out_mlp.0.weight; sweep {1e-4, 3e-4, 1e-3}
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.8
    patience: 5
    min_lr: 1.e-6
