resume: null
# Stage 2: fine-tune on the new dataset from the stage-1 (InNA zero-init) last.ckpt. Use with a run config that has num_folds: 1.
# Path = <output_dir>/log_fold_0/checkpoint/last.ckpt of config/runs/finetune_pra310-fold0.yml
init_weights: /mnt/HDD36/pavel/COPRA/results/experiments/copra-inna_zero-init_pra310-fold0_tune/log_fold_0/checkpoint/last.ckpt
model:
  model_type: copra
  esm_type: 650M
  pooling: token
  output_dim: 1
  fix_lms: true
  lora_tune: false
  lora_rank: 16
  lora_alpha: 32
  pair_dim: 40
  energy_embed_dim: 40
  representation_layer: 33
  coformer:
    embed_dim: 320
    pair_dim: 40
    num_blocks: 6
    num_heads: 20
    use_rot_emb: true
    attn_qkv_bias: false
    attention_dropout: 0.1
    transition_dropout: 0.0
    residual_dropout: 0.1
    transition_factor: 4
    use_flash_attn: false

train:
  seed: 2024
  optimizer:
    type: adam
    lr: 1.e-5      # everything except the energy tensors; sweep {3e-6, 1e-5}
    lr_new: 3.e-5  # energy_embeder.{freq,phase} + out_mlp.0.weight; sweep {3e-5, 1e-4}
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: warmup_cosine
    warmup_steps: 150        # ~6% of total_steps; Adam state is fresh (weights-only init)
    total_steps: 2360        # 40 epochs * ceil(936 / 16) = 40 * 59, batch_size 16, 1 GPU
    warmup_start_ratio: 0.1
    min_lr_ratio: 0.05